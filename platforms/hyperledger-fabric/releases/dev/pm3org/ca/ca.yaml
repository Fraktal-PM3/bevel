apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ca
  namespace: pm3org-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: ca
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-ca-server   
  values:
    global:
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
        kubernetesUrl: https://192.168.49.2:8443
      vault:
        type: hashicorp
        network: fabric
        address: https://kind-walls-sing.loca.lt
        authPath: devpm3org
        secretEngine: secretsv2
        secretPrefix: "data/devpm3org"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: org1proxy.pm3fraktal.se

    storage:
      size: 512Mi
      reclaimPolicy: "Delete"
      volumeBindingMode: Immediate
      allowedTopologies:
        enabled: false

    image:
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
      pullSecret: ""

    server:
      removeCertsOnDelete: true
      tlsStatus: true
      adminUsername: pm3org-admin
      adminPassword: pm3org-adminpw
      subject: "/C=SE/ST=Lulea/L=Lulea/O=Orderer"
      clusterIpPort: 7054

    labels:
      service:
        - example1: example2
      pvc:
      deployment:
