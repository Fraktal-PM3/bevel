apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: peer0
  namespace: org1-tf-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: peer0
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-peernode    
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.49.1:8200
        authPath: devorg1-tf
        secretEngine: secretsv2
        secretPrefix: "data/devorg1-tf"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: tfdev.fraktal-pm3.se

    storage:
      enabled: false
      nameOverride: org1-tf-bevel-storageclass
      peer: 512Mi
      couchdb: 512Mi

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.org1-tf-net.tfdev.fraktal-pm3.se
        caAdminUser: org1-tf-admin
        caAdminPassword: org1-tf-adminpw
        orgName: org1-tf
        type: peer
        componentSubject: "O=CGI,OU=CGI,L=London,C=GB"

      users: 
        usersList:
        - {'user': None, 'identity': 'user1', 'attributes': [{'key': 'hf.Revoker', 'value': 'true'}]}

      settings:
        createConfigMaps: False
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      couchdb: ghcr.io/hyperledger/bevel-fabric-couchdb
      peer: hyperledger/fabric-peer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: ""

    peer:
      gossipPeerAddress: peer0.org1-tf-net.tfdev.fraktal-pm3.se:443
      logLevel: info
      localMspId: org1-tfMSP
      tlsStatus: true
      cliEnabled: True
      storageClass: org1-tf-bevel-storageclass
      ordererAddress: orderer1.org1-tf-net.tfdev.fraktal-pm3.se:443
      builder: hyperledger/fabric-ccenv
      couchdb:
        username: org1-tf-user
        password: org1-tf-userpw
      mspConfig:
        organizationalUnitIdentifiers:
        nodeOUs:
          clientOUIdentifier: client
          peerOUIdentifier: peer
          adminOUIdentifier: admin
          ordererOUIdentifier: orderer
      serviceType: ClusterIP 
      loadBalancerType: ""
      ports:
        grpc:
          clusterIpPort: 7051
        events:
          clusterIpPort: 7053
        couchdb:
          clusterIpPort: 5984
        metrics:
          enabled: False
          clusterIpPort: 9443    
      resources:
        limits:
          memory: 1Gi
          cpu: 1
        requests:
          memory: 512M
          cpu: 0.25
      upgrade: False
      healthCheck: 
        retries: 20
        sleepTimeAfterError: 15

    labels:
      service:
        - example1: example2
      pvc:
      deployment:
