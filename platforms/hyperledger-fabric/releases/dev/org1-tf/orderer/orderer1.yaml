apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orderer1
  namespace: org1-tf-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: orderer1
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-dev
        namespace: flux-dev
      chart: platforms/hyperledger-fabric/charts/fabric-orderernode
  values:
    global:
      version: 2.5.4
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.49.1:8200
        authPath: devorg1-tf
        secretEngine: secretsv2
        secretPrefix: "data/devorg1-tf"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: tfdev.fraktal-pm3.se

    storage:
      enabled: false
      nameOverride: org1-tf-bevel-storageclass
      size: 512Mi

    certs:
      generateCertificates: true
      orgData:
        caAddress: ca.org1-tf-net.tfdev.fraktal-pm3.se
        caAdminUser: org1-tf-admin
        caAdminPassword: org1-tf-adminpw
        orgName: org1-tf
        type: orderer
        componentSubject: "O=CGI,OU=CGI,L=London,C=GB"

      settings:
        createConfigMaps: True
        refreshCertValue: false
        addPeerValue: false
        removeCertsOnDelete: true
        removeOrdererTlsOnDelete: true

    image:
      orderer: ghcr.io/hyperledger/bevel-fabric-orderer
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      pullSecret: ""

    orderer:
      consensus: raft
      logLevel: info
      localMspId: org1-tfMSP
      tlsStatus: true
      keepAliveServerInterval: 10s
      serviceType: ClusterIP
      ports:
        grpc:
          clusterIpPort: 7050
        metrics: 
          enabled: False
          clusterIpPort: 9443
      resources:
        limits:
          memory: 512M
          cpu: 1
        requests:
          memory: 512M
          cpu: 0.25
    healthCheck: 
      retries: 10
      sleepTimeAfterError: 15

      labels:
        service:
          - example1: example2
        pvc:
        deployment:
