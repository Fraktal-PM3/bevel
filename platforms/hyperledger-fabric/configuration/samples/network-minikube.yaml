---
# yaml-language-server: $schema=../../../../platforms/network-schema.json
# This is a sample configuration file for deploying Hyperledger Fabric on Minikube
# This configuration uses internal Kubernetes DNS and is optimized for single-cluster deployments
network:
  # Network level configuration specifies the attributes required for each organization
  # to join an existing network.
  type: fabric
  version: 2.5.4                 # currently tested 1.4.8, 2.2.2 and 2.5.4

  #Environment section for Kubernetes setup
  env:
    type: "local"              # tag for the environment. Important to run multiple flux on single cluster
    proxy: none                # CRITICAL: Use 'none' for minikube single-cluster deployments
    retry_count: 50            # Retry count for the checks
    external_dns: disabled     # Minikube doesn't need external DNS
    annotations:               # Additional annotations that can be used for some pods (ca, ca-tools, orderer and peer nodes)
      service:
       - example1: example2
      deployment: {}
      pvc: {}

  # Docker registry details where images are stored. This will be used to create k8s secrets
  # Please ensure all required images are built and stored in this registry.
  # Do not check-in docker_password.
  docker:
    url: "ghcr.io/hyperledger"
    # Comment out username and password for public repos
    #username: "docker_username"
    #password: "docker_password"

  # Remote connection information for orderer (will be blank or removed for orderer hosting organization)
  # For RAFT consensus, have odd number (2n+1) of orderers for consensus agreement to have a majority.
  consensus:
    name: raft
  orderers:
    - orderer:
      type: orderer
      name: orderer1
      org_name: supplychain                 # org_name should match one organization definition below in organizations: key
      uri: orderer1.supplychain-net:7050    # Internal URI using Kubernetes DNS - NO external domain

  # The channels defined for a network with participating peers in each channel
  channels:
  - channel:
    consortium: SupplyChainConsortium
    channel_name: AllChannel
    channel_status: new
    osn_creator_org: # Organization name, whose orderers will create the channel. Required for Fabric 2.5.x
      name: supplychain
    chaincodes:
      - "chaincode_name"  # Optional - can be added later via chaincode-ops.yaml
    orderers:
      - supplychain
    participants:
    - organization:
      name: carrier
      type: creator       # creator organization will create the channel and instantiate chaincode, in addition to joining the channel and install chaincode
      org_status: new
      peers:
      - peer:
        name: peer0
        gossipAddress: peer0.carrier-net:7051         # Internal URI using Kubernetes DNS
        peerAddress: peer0.carrier-net:7051           # Internal URI using Kubernetes DNS
      ordererAddress: orderer1.supplychain-net:7050   # Internal URI using Kubernetes DNS
    - organization:
      name: manufacturer
      type: joiner
      org_status: new
      peers:
      - peer:
        name: peer0
        gossipAddress: peer0.manufacturer-net:7051    # Internal URI using Kubernetes DNS
        peerAddress: peer0.manufacturer-net:7051      # Internal URI using Kubernetes DNS
      ordererAddress: orderer1.supplychain-net:7050   # Internal URI using Kubernetes DNS
    endorsers:
    # Only one peer per org required for endorsement
    - organization:
      name: carrier
      peers:
      - peer:
        name: peer0
        corepeerAddress: peer0.carrier-net:7051
        certificate: "/home/bevel/build/carrier/server.crt" # certificate path for peer
    - organization:
      name: manufacturer
      peers:
      - peer:
        name: peer0
        corepeerAddress: peer0.manufacturer-net:7051
        certificate: "/home/bevel/build/manufacturer/server.crt" # certificate path for peer

  # Allows specification of one or many organizations that will be connecting to a network.
  # If an organization is also hosting the root of the network (e.g. doorman, membership service, etc),
  # then these services should be listed in this section as well.
  organizations:

    # Specification for the 1st organization. Each organization maps to a VPC and a separate k8s cluster
    - organization:
      name: supplychain
      country: UK
      state: London
      location: London
      subject: "O=Orderer,L=51.50/-0.13/London,C=GB"
      external_url_suffix: develop.local.com   # Ignored when proxy is 'none'
      org_status: new
      fabric_console: disabled                 # Set to enabled if you want to deploy Fabric Operations Console
      ca_data:
        certificate: /home/bevel/build/supplychain/server.crt

      cloud_provider: minikube   # CRITICAL: Must be 'minikube' for minikube deployments
      # aws section is ignored when cloud_provider is minikube
      aws:
        access_key: "aws_access_key"        # Not used for minikube
        secret_key: "aws_secret_key"        # Not used for minikube

      # Kubernetes cluster deployment variables. The config file path and name has to be provided in case
      # the cluster has already been created.
      k8s:
        region: "minikube"                   # Use 'minikube' as region
        context: "minikube"                  # CRITICAL: Must match your minikube context name
        config_file: "/home/bevel/build/config"  # Path to kubeconfig inside the container

      # Hashicorp Vault server address and root-token. Vault should be unsealed.
      # Do not check-in root_token
      # IMPORTANT: Use your machine's LOCAL IP address, NOT localhost or 127.0.0.1
      vault:
        url: "http://192.168.1.100:8200"    # REPLACE with your actual local IP address
        root_token: "hvs.XXXXXXXXXXXX"      # REPLACE with your actual vault root token
        secret_path: "secretsv2"

      # Git Repo details which will be used by GitOps/Flux.
      # Do not check-in git_access_token
      gitops:
        git_protocol: "https" # Option for git over https or ssh
        git_url: "https://github.com/<username>/bevel.git"           # REPLACE with your forked repo URL
        branch: "local"                                               # Create this branch before deployment
        release_dir: "platforms/hyperledger-fabric/releases/dev"     # Relative Path in the Git repo for flux sync per environment.
        component_dir: "platforms/hyperledger-fabric/releases/k8sComponent" # Relative path where values files are stored.
        chart_source: "platforms/hyperledger-fabric/charts"          # Relative Path where the Helm charts are stored in Git repo
        git_repo: "github.com/<username>/bevel.git"                  # REPLACE - Gitops git repository URL for git push (without https://)
        username: "github_username"                                  # REPLACE with your GitHub username
        password: "github_token"                                     # REPLACE with your GitHub personal access token
        email: "git@email.com"                                       # REPLACE with your email
        private_key: "/home/bevel/build/gitops"                      # Path to private key file (only needed for SSH)

      # Services maps to the pods that will be deployed on the k8s cluster
      # This sample is an orderer service and includes a raft consensus
      services:
        ca:
          name: ca
          subject: "/C=GB/ST=London/L=London/O=Orderer/CN=ca.supplychain-net"
          type: ca
          grpc:
            port: 7054

        consensus:
          name: raft

        orderers:
        - orderer:
          name: orderer1
          type: orderer
          consensus: raft
          grpc:
            port: 7050
          metrics:
            enabled: false
            port: 9443
          ordererAddress: orderer1.supplychain-net:7050  # Internal Kubernetes DNS address

    # Specification for the 2nd organization. Each organization maps to a VPC and a separate k8s cluster
    - organization:
      name: manufacturer
      country: CH
      state: Zurich
      location: Zurich
      subject: "O=Manufacturer,OU=Manufacturer,L=47.38/8.54/Zurich,C=CH"
      external_url_suffix: develop.local.com   # Ignored when proxy is 'none'
      org_status: new
      orderer_org: supplychain # Name of the organization that provides the ordering service
      ca_data:
        certificate: /home/bevel/build/manufacturer/server.crt

      cloud_provider: minikube   # CRITICAL: Must be 'minikube' for minikube deployments
      # aws section is ignored when cloud_provider is minikube
      aws:
        access_key: "aws_access_key"        # Not used for minikube
        secret_key: "aws_secret_key"        # Not used for minikube

      # Kubernetes cluster deployment variables. The config file path and name has to be provided in case
      # the cluster has already been created.
      k8s:
        region: "minikube"
        context: "minikube"
        config_file: "/home/bevel/build/config"

      # Hashicorp Vault server address and root-token. Vault should be unsealed.
      # Do not check-in root_token
      # IMPORTANT: Use your machine's LOCAL IP address, NOT localhost or 127.0.0.1
      vault:
        url: "http://192.168.1.100:8200"    # REPLACE with your actual local IP address
        root_token: "hvs.XXXXXXXXXXXX"      # REPLACE with your actual vault root token
        secret_path: "secretsv2"

      # Git Repo details which will be used by GitOps/Flux.
      # Do not check-in git_access_token
      gitops:
        git_protocol: "https" # Option for git over https or ssh
        git_url: "https://github.com/<username>/bevel.git"           # REPLACE with your forked repo URL
        branch: "local"
        release_dir: "platforms/hyperledger-fabric/releases/dev"
        component_dir: "platforms/hyperledger-fabric/releases/k8sComponent"
        chart_source: "platforms/hyperledger-fabric/charts"
        git_repo: "github.com/<username>/bevel.git"                  # REPLACE - without https://
        username: "github_username"                                  # REPLACE with your GitHub username
        password: "github_token"                                     # REPLACE with your GitHub token
        email: "git@email.com"                                       # REPLACE with your email
        private_key: "/home/bevel/build/gitops"

      # Generating User Certificates with custom attributes using Fabric CA in BAF for Peer Organizations
      users:
      - user:
        identity: user1
        attributes:
          - key: "hf.Revoker"
            value: "true"
      # The participating nodes are peers
      # This organization hosts it's own CA server
      services:
        ca:
          name: ca
          subject: "/C=CH/ST=Zurich/L=Zurich/O=Manufacturer/CN=ca.manufacturer-net"
          type: ca
          grpc:
            port: 7054
        peers:
        - peer:
          name: peer0
          type: anchor                                          # This can be anchor/nonanchor. Atleast one peer should be anchor peer.
          gossippeeraddress: peer0.manufacturer-net:7051        # Internal Address using Kubernetes DNS
          peerAddress: peer0.manufacturer-net:7051              # Internal Address using Kubernetes DNS
          cli: enabled                                          # Creates a peer cli pod depending upon the (enabled/disabled) tag.
          cactus_connector: disabled                            # set to enabled to create a cactus connector for Fabric
          grpc:
            port: 7051
          events:
            port: 7053
          couchdb:
            port: 5984
          restserver:           # This is for the rest-api server
            targetPort: 20001
            port: 20001
          expressapi:           # This is for the express api server
            targetPort: 3000
            port: 3000
          chaincodes:
            # Chaincode deployment is optional for initial network setup
            # You can deploy chaincode later using the chaincode-ops.yaml playbook
            - name: "supplychain"    # This has to be replaced with the name of the chaincode
              version: "1"           # This has to be replaced with the version of the chaincode (do NOT use .)
              maindirectory: "cmd"   # The main directory where chaincode is needed to be placed
              lang: "golang"         # The language in which the chaincode is written ( golang/java/node )
              repository:
                username: "github_username"          # REPLACE - Git user with read rights to repo
                password: "git_access_token"         # REPLACE - Git token of above user
                url: "github.com/<username>/bevel-samples.git"  # REPLACE - chaincode repository
                branch: main
                path: "examples/supplychain-app/fabric/chaincode_rest_server/chaincode/"  # The path to the chaincode in the repo
              arguments: '\"init\",\"\"'                        # Arguments to be passed along with the chaincode parameters
              endorsements: ""                                  # Endorsements (if any) provided along with the chaincode
          metrics:
            enabled: false
            port: 9443
    - organization:
      name: carrier
      country: GB
      state: London
      location: London
      subject: "O=Carrier,OU=Carrier,L=51.50/-0.13/London,C=GB"
      external_url_suffix: develop.local.com   # Ignored when proxy is 'none'
      org_status: new
      orderer_org: supplychain # Name of the organization that provides the ordering service
      ca_data:
        certificate: /home/bevel/build/carrier/server.crt

      cloud_provider: minikube   # CRITICAL: Must be 'minikube' for minikube deployments
      # aws section is ignored when cloud_provider is minikube
      aws:
        access_key: "aws_access_key"        # Not used for minikube
        secret_key: "aws_secret_key"        # Not used for minikube

      # Kubernetes cluster deployment variables. The config file path and name has to be provided in case
      # the cluster has already been created.
      k8s:
        region: "minikube"
        context: "minikube"
        config_file: "/home/bevel/build/config"

      # Hashicorp Vault server address and root-token. Vault should be unsealed.
      # Do not check-in root_token
      # IMPORTANT: Use your machine's LOCAL IP address, NOT localhost or 127.0.0.1
      vault:
        url: "http://192.168.1.100:8200"    # REPLACE with your actual local IP address
        root_token: "hvs.XXXXXXXXXXXX"      # REPLACE with your actual vault root token
        secret_path: "secretsv2"

      # Git Repo details which will be used by GitOps/Flux.
      # Do not check-in git_access_token
      gitops:
        git_protocol: "https" # Option for git over https or ssh
        git_url: "https://github.com/<username>/bevel.git"           # REPLACE with your forked repo URL
        branch: "local"
        release_dir: "platforms/hyperledger-fabric/releases/dev"
        component_dir: "platforms/hyperledger-fabric/releases/k8sComponent"
        chart_source: "platforms/hyperledger-fabric/charts"
        git_repo: "github.com/<username>/bevel.git"                  # REPLACE - without https://
        username: "github_username"                                  # REPLACE with your GitHub username
        password: "github_token"                                     # REPLACE with your GitHub token
        email: "git@email.com"                                       # REPLACE with your email
        private_key: "/home/bevel/build/gitops"

      # Generating User Certificates with custom attributes using Fabric CA in BAF for Peer Organizations
      users:
      - user:
        identity: user1
        attributes:
          - key: "hf.Revoker"
            value: "true"
      services:
        ca:
          name: ca
          subject: "/C=GB/ST=London/L=London/O=Carrier/CN=ca.carrier-net"
          type: ca
          grpc:
            port: 7054
        peers:
        - peer:
          name: peer0
          type: anchor                                      # This can be anchor/nonanchor. Atleast one peer should be anchor peer.
          gossippeeraddress: peer0.carrier-net:7051         # Internal Address using Kubernetes DNS
          peerAddress: peer0.carrier-net:7051               # Internal Address using Kubernetes DNS
          cli: enabled                                      # Creates a peer cli pod depending upon the (enabled/disabled) tag.
          cactus_connector: disabled                        # set to enabled to create a cactus connector for Fabric
          grpc:
            port: 7051
          events:
            port: 7053
          couchdb:
            port: 5984
          restserver:
            targetPort: 20001
            port: 20001
          expressapi:
            targetPort: 3000
            port: 3000
          chaincodes:
            # Chaincode deployment is optional for initial network setup
            # You can deploy chaincode later using the chaincode-ops.yaml playbook
            - name: "supplychain"    # This has to be replaced with the name of the chaincode
              version: "1"           # This has to be replaced with the version of the chaincode (do NOT use .)
              maindirectory: "cmd"   # The main directory where chaincode is needed to be placed
              lang: "golang"         # The language in which the chaincode is written ( golang/java/node )
              repository:
                username: "github_username"          # REPLACE - Git user with read rights to repo
                password: "git_access_token"         # REPLACE - Git token of above user
                url: "github.com/<username>/bevel-samples.git"  # REPLACE - chaincode repository
                branch: main
                path: "examples/supplychain-app/fabric/chaincode_rest_server/chaincode/"  # The path to the chaincode in the repo
              arguments: '\"init\",\"\"'                        # Arguments to be passed along with the chaincode parameters
              endorsements: ""                                  # Endorsements (if any) provided along with the chaincode
          metrics:
            enabled: false
            port: 9443
